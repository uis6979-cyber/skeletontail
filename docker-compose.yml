version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: skeleton-postgres
    restart: always
    # Environment variables to initialize the DB with your specific credentials
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    # Mapping the internal container port to your localhost
    ports:
      - "5432:5432"
    # Data persistence: ensures your data survives if the container is stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local